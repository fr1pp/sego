[package]
name = "harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "The sego test harness: case runner, replay transport, record and live modes"
publish = false

[lib]
doctest = false

[dependencies]
datatest-stable = "0.3.3"
sego = { path = ".." }
serde_json = "1"
tempfile = { version = "3", default-features = false }

[lints]
workspace = true

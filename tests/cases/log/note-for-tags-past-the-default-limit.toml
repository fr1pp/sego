# More than 1000 tags: only the newest 1000 mark commits, and a note says so.
args = ["log", "example.com/acme/widget@v3.0.0"]
status.code = 0
stdout = '''
example.com/acme/widget@aaaa11111111  3 commits  rev v3.0.0
aaaa11111111  2026-08-01  Ada Lovelace  (tag: v3.0.0) Release 3.0.0
bbbb22222222  2026-07-30  Grace Hopper  Fix the parser
cccc33333333  2026-07-29  Ada Lovelace  (tag: v3.0.0-rc.1) Start 3.0.0
'''
stderr = '''
sego: note: tags marked from the 1000 newest of 1250
'''

[[exchange]]
operation = "Log"
variables = '{"first":151,"gitlab":false,"path":null,"repo0":"example.com/acme/widget","repo1":"","rev":"v3.0.0"}'
query = '''
query Log($repo0: String!, $repo1: String!, $gitlab: Boolean!, $rev: String!, $path: String, $first: Int) {
  r0: repository(name: $repo0) { ...History }
  t0: repository(name: $repo0) { ...Tags }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...History }
  t1: repository(name: $repo1) @include(if: $gitlab) { ...Tags }
}

fragment History on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $rev) { oid ancestors(first: $first, path: $path) { ...Page } }
}
fragment Page on GitCommitConnection {
  nodes { oid subject author { date person { displayName } } parents { oid } }
  pageInfo { hasNextPage }
}

fragment Tags on Repository {
  name
  defaultBranch { displayName }
  gitRefs(type: GIT_TAG, first: 1000) { totalCount nodes { displayName target { oid } } }
}
'''
status = 200
content-type = "application/json"

operation = "LogRange"
variables = '{"a":"0123456789abcdef0123456789abcdef01234567","b":"456789abcdef0123456789abcdef0123456789ab","count":true,"first":150,"path":null,"probe":false,"repo":"example.com/acme/widget"}'

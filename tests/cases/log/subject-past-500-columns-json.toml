# In JSON a subject past 500 columns is whole.
args = ["log", "--json", "example.com/acme/widget@v2"]
status.code = 0
stdout = '''
{"repo":"example.com/acme/widget","rev":"v2","commit":"0001000100010001000100010001000100010001","rev_a":null,"rev_b":null,"commit_a":null,"commit_b":null,"path":null,"total":null,"more":false,"commits":[{"commit":"0001000100010001000100010001000100010001","date":"2026-08-01","author":"Ada Lovelace","subject":"","parents":["0002000200020002000200020002000200020002"],"tags":[]}]}
'''

[[exchange]]
operation = "Log"
variables = '{"first":151,"gitlab":false,"path":null,"repo0":"example.com/acme/widget","repo1":"","rev":"v2"}'
query = '''
query Log($repo0: String!, $repo1: String!, $gitlab: Boolean!, $rev: String!, $path: String, $first: Int) {
  r0: repository(name: $repo0) { ...History }
  t0: repository(name: $repo0) { ...Tags }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...History }
  t1: repository(name: $repo1) @include(if: $gitlab) { ...Tags }
}

fragment History on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $rev) { oid ancestors(first: $first, path: $path) { ...Page } }
}
fragment Page on GitCommitConnection {
  nodes { oid subject author { date person { displayName } } parents { oid } }
  pageInfo { hasNextPage }
}

fragment Tags on Repository {
  name
  defaultBranch { displayName }
  gitRefs(type: GIT_TAG, first: 1000) { totalCount nodes { displayName target { oid } } }
}
'''
status = 200
content-type = "application/json"
response = '''

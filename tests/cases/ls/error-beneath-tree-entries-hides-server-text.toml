      "c0": {
        "file": null,
        "oid": "1a2b3c4d5e6f708192a3b4c5d6e7f80910111213",
        "parent": {
          "entries": [
            {
              "path": "docs",
              "submodule": null
            }
          ]
        },
        "tree": {
          "entries": [
            {
              "isDirectory": false,
              "path": "docs/guide.md",
              "submodule": null
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/partial"
    }
  },

# A tree URL names a branch or tag and a path; the split is settled by asking.
args = ["ls", "https://github.com/gorilla/mux/tree/v1.8.0/.github"]
status.code = 0
stdout = '''
github.com/gorilla/mux@98cb6bf42e08:.github  2 entries  2 files  rev v1.8.0
file       .github/release-drafter.yml
file       .github/stale.yml
'''

[[exchange]]
operation = "ListTree"
variables = '{"ambiguous0":false,"ambiguous1":false,"gitlab":false,"parent0":"","parent1":"","path0":".github","path1":"","recursive":false,"repo0":"github.com/gorilla/mux","repo1":"","rev0":"v1.8.0","rev1":"v1.8.0/.github","split":true}'
query = '''
query ListTree($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $recursive: Boolean!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!
$rev1: String!, $path1: String!, $parent1: String!, $ambiguous1: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    tree: tree(path: $path0) { entries(recursive: $recursive) { path isDirectory submodule { url commit } } }
    file: blob(path: $path0) { totalLines byteSize binary }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
c1: commit(rev: $rev1) {
    oid
    tree: tree(path: $path1) { entries(recursive: $recursive) { path isDirectory submodule { url commit } } }
    file: blob(path: $path1) { totalLines byteSize binary }
    parent: tree(path: $parent1) { entries { path submodule { url commit } } }
    x1: path(path: $path1) @include(if: $split) { __typename }
  }
  g1: gitRefs(query: $rev1, first: 5) @include(if: $ambiguous1) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"

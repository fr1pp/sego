# A failed directory listing names the part, not the server's text.
args = ["ls", "example.com/acme/listing@v2.0.0:docs"]
status.code = 1
stderr = '''
sego: error: Sourcegraph failed to answer the directory listing
'''

[[exchange]]
operation = "ListTree"
variables = '{"ambiguous0":false,"gitlab":false,"parent0":"","path0":"docs","recursive":false,"repo0":"example.com/acme/listing","repo1":"","rev0":"v2.0.0","split":false}'
query = '''
query ListTree($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $recursive: Boolean!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    tree: tree(path: $path0) { entries(recursive: $recursive) { path isDirectory submodule { url commit } } }
    file: blob(path: $path0) { totalLines byteSize binary }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "file": null,
        "oid": "0a1b2c3d4e5f60718293a4b5c6d7e8f901234567",
        "parent": {
          "entries": [
            {
              "path": "docs",
              "submodule": null
            }
          ]
        },
        "tree": null
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/listing"
    }
  },
  "errors": [
    {
      "message": "rpc error: code = Internal desc = git command failed on host gitserver-3.internal",
      "path": [
        "r0",
        "c0",
        "tree"
      ]
    }
  ]
}
'''

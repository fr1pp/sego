# Names, a submodule's URL and its commit with control characters are escaped.
args = ["ls", "example.com/acme/widget"]
status.code = 0
stdout = '''
example.com/acme/widget@0123456789ab  4 entries  1 dir  1 file  2 submodules
file       $'a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i'
dir        $'a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i-dir'/
submodule  mod  example.com/acme/lib@a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}
submodule  sub  https://example.com/a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i
'''

[[exchange]]
operation = "ListTree"
variables = '{"ambiguous0":false,"gitlab":false,"parent0":"","path0":"","recursive":false,"repo0":"example.com/acme/widget","repo1":"","rev0":"HEAD","split":false}'
query = '''
query ListTree($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $recursive: Boolean!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    tree: tree(path: $path0) { entries(recursive: $recursive) { path isDirectory submodule { url commit } } }
    file: blob(path: $path0) { totalLines byteSize binary }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "file": null,
        "oid": "0123456789abcdef0123456789abcdef01234567",
        "parent": null,
        "tree": {
          "entries": [
            {
              "isDirectory": false,
              "path": "a\u001bb\u202ec\u200bd\ne\rf\u0000g\u2028h\u007fi",
              "submodule": null
            },
            {
              "isDirectory": true,
              "path": "a\u001bb\u202ec\u200bd\ne\rf\u0000g\u2028h\u007fi-dir",
              "submodule": null
            },
            {
              "isDirectory": false,

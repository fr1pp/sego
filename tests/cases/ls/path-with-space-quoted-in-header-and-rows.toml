# A path with a space is shell-quoted in the header and the rows, so each pastes into the next command.
args = ["ls", "example.com/acme/widget@v1.0.0:a b"]
status.code = 0
stdout = '''
'example.com/acme/widget@98cb6bf42e08:a b'  2 entries  1 dir  1 file  rev v1.0.0
file       'a b/c.go'
dir        'a b/d e'/
'''

[[exchange]]
operation = "ListTree"
variables = '{"ambiguous0":false,"gitlab":false,"parent0":"","path0":"a b","recursive":false,"repo0":"example.com/acme/widget","repo1":"","rev0":"v1.0.0","split":false}'
query = '''
query ListTree($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $recursive: Boolean!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    tree: tree(path: $path0) { entries(recursive: $recursive) { path isDirectory submodule { url commit } } }
    file: blob(path: $path0) { totalLines byteSize binary }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "file": null,
        "oid": "98cb6bf42e086f6af920b965c38cacc07402d51b",
        "parent": {
          "entries": [
            {
              "isDirectory": true,
              "path": "a b",
              "submodule": null
            }
          ]
        },
        "tree": {
          "entries": [
            {
              "isDirectory": false,
              "path": "a b/c.go",
              "submodule": null
            },
            {
              "isDirectory": true,
              "path": "a b/d e",
              "submodule": null
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  }
}
'''

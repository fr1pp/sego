# A missing path with control characters is escaped in the error.
args = ["ls", "example.com/acme/widget:a\u001Bb\u202Ec\u200Bd\ne\rf\u0000g\u2028h\u007Fi-gone"]
status.code = 1
stderr = '''
sego: error: a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i-gone not found in example.com/acme/widget@0123456789ab
  sego search $'repo:^example\\.com/acme/widget$@0123456789ab file:(^|/)a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i-gone(/|$) count:all' lists the files named a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i-gone, or under a directory named a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i-gone, at 0123456789ab
  sego log $'example.com/acme/widget@0123456789ab:a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i-gone' lists any commits that changed a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i-gone
'''

[[exchange]]
operation = "File"
variables = "{\"content\":false,\"gitlab\":false,\"path\":\"a\\u001bb\u202Ec\u200Bd\\ne\\rf\\u0000g\u2028h\u007Fi-gone\",\"recursive\":false,\"repo0\":\"example.com/acme/widget\",\"repo1\":\"\",\"rev\":\"HEAD\"}"

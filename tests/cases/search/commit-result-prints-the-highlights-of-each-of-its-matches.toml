# A commit with two matches prints the lines around the highlights of each.
args = ["search", "repo:example.com/acme/widget type:commit m"]
status.code = 0
stdout = '''
1 commit  1 repo  0.7 s
query  timeout:60s repo:example.com/acme/widget type:commit m

example.com/acme/widget@aaaaaaaaaaaa  2024-05-06  Ann  Fix it
    m1
    x2
--
    y3
    m4
'''

[[exchange]]
operation = "Search"
variables = '{"query":"timeout:60s repo:example.com/acme/widget type:commit m"}'
document = "Search-0d6a0fa4"
status = 200
content-type = "application/json"

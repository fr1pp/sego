# A range that ends far past its chunk is clamped to the chunk's last line.
args = ["search", "--json", "repo:example.com/app foo"]
status.code = 0
stdout = '''
{"query":"repo:example.com/app foo","pattern_type":"keyword","unit":"matches","count":1,"at_least":false,"stopped":false,"elapsed_ms":100,"limit_ms":20000,"widen":[],"unindexed":[],"alert":null,"results":[{"kind":"line","repo":"example.com/app","commit":"0123456789abcdef0123456789abcdef01234567","rev":null,"path":"a.go","line":4,"text":"ab","match":true,"ranges":[[1,2]],"chunk":1},{"kind":"line","repo":"example.com/app","commit":"0123456789abcdef0123456789abcdef01234567","rev":null,"path":"a.go","line":5,"text":"cd","match":true,"ranges":[[0,2]],"chunk":1}],"server":{"match_count":1,"approximate_count":"1","limit_hit":false,"timedout":[]}}
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/app foo","unindexed":"repo:example.com/app type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''
status = 200
content-type = "application/json"

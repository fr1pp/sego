# A null listing leaves the unindexed files unknown.
args = ["search", "repo:example.com/acme/widget foo"]
status.code = 0
stdout = '''
0 matches  0.2 s
query  repo:example.com/acme/widget foo
'''
stderr = '''
sego: note: the search can't tell which files it skipped; files over 1 MiB and files with too many distinct trigrams are never searched
sego: note: Sourcegraph doesn't report a search backend that fails to answer, and a 0 can come from one
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/acme/widget foo","unindexed":"repo:example.com/acme/widget type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"}'
document = "Search-328cc8ec"
status = 200
content-type = "application/json"
response = '''
{

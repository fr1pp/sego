# A limitHit with no results is not a lower bound of anything.
args = ["search", "repo:example.com/app select:file.directory foo count:30"]
status.code = 0
stdout = '''
0 directories  0.4 s
query  repo:example.com/app select:file.directory foo count:30
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/app select:file.directory foo count:30","unindexed":"repo:example.com/app type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:60s"}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 400,
        "limitHit": true,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    },
    "unindexed": {
      "results": {
        "alert": null,
        "elapsedMilliseconds": 10,
        "limitHit": false,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

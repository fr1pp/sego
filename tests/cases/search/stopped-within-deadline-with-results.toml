# A repository the server stopped searching makes the search stopped, even when
# it answered in time, and the count a lower bound.
args = ["search", "repo:example.com/app foo count:30"]
status.code = 0
stdout = '''
5+ matches  1 repo  stopped at 1.2 s
query  repo:example.com/app foo count:30

example.com/app@0123456789ab:main.go
1:foo 0
2:foo 1
3:foo 2
4:foo 3
5:foo 4
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/app foo count:30","unindexed":"repo:example.com/app type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:60s"}'
document = "Search-328cc8ec"

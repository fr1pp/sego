# An Unable To Process Query alert with no description is an error titled by the
# alert.
args = ["search", "lang:nosuchlang foo"]
status.code = 3
stderr = '''
sego: error: Unable To Process Query
'''

[[exchange]]
operation = "Search"
variables = '{"query":"lang:nosuchlang foo"}'
document = "Search-8bd92430"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": {
          "description": null,
          "kind": null,
          "proposedQueries": null,
          "title": "Unable To Process Query"
        },
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 100,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

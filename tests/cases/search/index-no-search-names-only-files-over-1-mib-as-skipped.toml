# With index:no the trigram-heavy files are searched, so the note on a search
# that can't list them names only the files over 1 MiB.
args = ["search", "repo:example.com/acme/router INDEX:no a or b"]
status.code = 0
stdout = '''
0 matches  0.1 s
query  repo:example.com/acme/router INDEX:no a or b
'''
stderr = '''
sego: note: the search can't tell which files it skipped; files over 1 MiB are never searched
sego: note: Sourcegraph doesn't report a search backend that fails to answer, and a 0 can come from one
'''

[[exchange]]
operation = "Search"
variables = '{"listed":false,"query":"repo:example.com/acme/router INDEX:no a or b","unindexed":""}'
document = "Search-328cc8ec"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 100,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

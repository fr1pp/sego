sego: note: 1 result of kind Weird not shown
'''

[[exchange]]
operation = "Search"
variables = '{"query":"timeout:60s repo:example.com/acme/widget foo"}'
document = "Search-8bd92430"
status = 200
content-type = "application/json"
response = '''

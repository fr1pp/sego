# The reason with no files is left out of the note, and a file of exactly 1 MiB counts as too
# many distinct trigrams.
args = ["search", "repo:example.com/acme/lib foo"]
status.code = 0
stdout = '''
0 matches  0.1 s
query  repo:example.com/acme/lib foo
'''
stderr = '''
sego: note: the contents of 2 files in scope aren't in the search index (2 too many distinct trigrams):
  example.com/acme/lib@0123456789ab:u  1.0 MiB
  example.com/acme/lib@0123456789ab:t  100 B
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/acme/lib foo","unindexed":"repo:example.com/acme/lib type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''
status = 200
content-type = "application/json"

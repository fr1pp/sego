# `Or(` is an operator, so the query splits into two searches, the second across every repository.
args = ["search", 'repo:^github\.com/gorilla/mux$ zqxv Or(NewRouter)']
status.code = 0
stdout = '''
30+ matches  1 repo  0.8 s
query  timeout:60s repo:^github\.com/gorilla/mux$ zqxv Or(NewRouter)

example.com/acme/server@0123456789ab:main.go
12:	r := mux.NewRouter()
'''


# `Or(` is an operator, so the query splits into two searches, the second across every repository: no widen line, and no side query for unindexed files.
args = ["search", 'repo:^github\.com/gorilla/mux$ zqxv Or(NewRouter)']
status.code = 0
stdout = '''
30+ matches  1 repo  0.8 s
query  repo:^github\.com/gorilla/mux$ zqxv Or(NewRouter)

example.com/acme/server@0123456789ab:main.go
12:	r := mux.NewRouter()
'''
stderr = '''
sego: note: filters outside parentheses apply only to the operand of OR they sit in; the other operands search every repository
'''

# Written by hand: the second search is cut, and cut results vary from run to run.
[[exchange]]
operation = "Search"
variables = '{"listed":false,"query":"repo:^github\\.com/gorilla/mux$ zqxv Or(NewRouter)","unindexed":""}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''

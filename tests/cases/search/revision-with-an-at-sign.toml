# A missing revision splits from its repository at the first @.
args = ["search", "repo:example.com/acme/lib@v1 foo"]
status.code = 1
stderr = '''
sego: error: revision v@2 not found in a/b
'''

[[exchange]]
operation = "Search"
variables = '{"query":"timeout:60s repo:example.com/acme/lib@v1 foo"}'
document = "Search-8bd92430"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": {
          "description": "x:\n  * a/b@v@2",
          "kind": null,
          "proposedQueries": null,
          "title": "Some revisions could not be searched"
        },
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 100,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

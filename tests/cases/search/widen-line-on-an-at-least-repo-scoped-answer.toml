# With a repo: filter the widen line is on every answer, an at least one too.
args = ["search", "repo:example.com/acme/widget foo count:1"]
status.code = 0
stdout = '''
1+ matches  1 repo  0.1 s
query  timeout:60s repo:example.com/acme/widget foo count:1
widen  archived:yes (3 repos)

example.com/acme/widget@0123456789ab:main.go
1:foo
'''

[[exchange]]
operation = "Search"
variables = '{"query":"timeout:60s repo:example.com/acme/widget foo count:1"}'
document = "Search-0d6a0fa4"
status = 200
content-type = "application/json"
response = '''

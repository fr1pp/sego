# A commit message line past 500 columns is cut to a window around its highlight.
args = ["search", "repo:example.com/acme/widget type:commit NEEDL"]
status.code = 0
stdout = '''
1 commit  1 repo  0.7 s
query  repo:example.com/acme/widget type:commit NEEDL

example.com/acme/widget@aaaaaaaaaaaa  2024-05-06  Ann  Fix the parser
    Fix the parser
    …… (+605 more columns; --json has the full line)
'''

[[exchange]]
operation = "Search"
variables = '{"listed":false,"query":"repo:example.com/acme/widget type:commit NEEDL","unindexed":""}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "1",
        "dynamicFilters": [],
        "elapsedMilliseconds": 700,
        "limitHit": false,
        "matchCount": 1,
        "results": [
          {
            "__typename": "CommitSearchResult",
            "commit": {
              "author": {
                "date": "2024-05-06T07:08:09Z",
                "person": {
                  "displayName": "Ann"
                }
              },
              "oid": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              "repository": {
                "name": "example.com/acme/widget"
              },

# With timeout:0s every answer arrives past the deadline, so a zero is stopped.
args = ["search", "repo:example.com/acme/widget foo timeout:0s"]
status.code = 3
stderr = '''
sego: error: the search stopped at 0.0 s with no results
'''

[[exchange]]
operation = "Search"
variables = '{"query":"repo:example.com/acme/widget foo timeout:0s"}'
document = "Search-0d6a0fa4"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 0,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

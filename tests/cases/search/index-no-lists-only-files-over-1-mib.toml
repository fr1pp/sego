# With index:no the unindexed files listed are only those over 1 MiB; a file of
# exactly 1 MiB is not.
args = ["search", "repo:example.com/acme/router index:no foo"]
status.code = 0
stdout = '''
1 match  1 repo  0.1 s
query  repo:example.com/acme/router index:no foo

example.com/acme/router@0123456789ab:main.go
1:foo
'''
stderr = '''
sego: note: the contents of 2 files in scope aren't in the search index (2 over 1 MiB):
  bigger  3.0 MiB
  big  2.0 MiB
sego: note: sego show reads the 2 files over 1 MiB, which no search reaches
'''


operation = "Search"
variables = '{"listed":true,"query":"repo:example.com/acme/router index:no foo","unindexed":"repo:example.com/acme/router type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"}'

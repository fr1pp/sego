# A regular expression the server can't compile, reported as an alert, is the same usage error as one reported as a GraphQL error.
args = ["search", "repo:example.com/acme/widget /(a/"]
status.code = 2
stderr = '''
sego: error: the search's regular expression doesn't compile: missing closing ): `(a`
usage: sego search [--json] QUERY...
'''

[[exchange]]
operation = "Search"
variables = '{"query":"repo:example.com/acme/widget /(a/"}'
document = "Search-8bd92430"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": {
          "description": "Error parsing regexp: missing closing ): `(a`",
          "kind": null,
          "proposedQueries": null,
          "title": "Unable To Process Query"
        },
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 3,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

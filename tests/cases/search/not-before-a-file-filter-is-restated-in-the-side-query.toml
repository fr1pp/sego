# `NOT` before a file: filter negates it, and the side query restates it as -file:.
args = ["search", 'repo:^github\.com/gorilla/mux$ NOT file:test zqxv']
status.code = 0
stdout = '''
0 matches  3.1 s
query  repo:^github\.com/gorilla/mux$ NOT file:test zqxv
'''

[[exchange]]
operation = "Search"
variables = '{"listed":true,"query":"repo:^github\\.com/gorilla/mux$ NOT file:test zqxv","unindexed":"repo:^github\\.com/gorilla/mux$ -file:test type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''
status = 200
content-type = "application/json"
recorded = { date = 2026-10-26, endpoint = "https://sourcegraph.com" }
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 3125,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    },
    "unindexed": {
      "results": {
        "alert": null,
        "elapsedMilliseconds": 3124,
        "limitHit": false,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

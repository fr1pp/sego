# A commit record keeps the highlights that fall in the message or diff, and
# drops the ones before its first line or past its last.
args = ["search", "--json", "repo:example.com/app type:diff foo"]
status.code = 0
stdout = '''
{"query":"repo:example.com/app type:diff foo","pattern_type":"keyword","unit":"commits","count":1,"at_least":false,"stopped":false,"elapsed_ms":100,"limit_ms":20000,"widen":[],"unindexed":null,"alert":null,"results":[{"kind":"commit","repo":"example.com/app","commit":"0123456789abcdef0123456789abcdef01234567","date":"2024-05-06","author":"Ann","subject":"fix","lines":["old_test.go old_test.go","@@ -263,0 +263,3 @@ x","+a"],"highlights":[[2,1,3]],"preview_limited":false}],"server":{"match_count":4,"approximate_count":"4","limit_hit":false,"timedout":[]}}
'''

[[exchange]]
operation = "Search"
variables = '{"listed":false,"query":"repo:example.com/app type:diff foo","unindexed":""}'
query = '''
query Search($query: String!, $unindexed: String!, $listed: Boolean!) {
  search(query: $query, version: V3, patternType: keyword) {
    results {
      matchCount approximateResultCount limitHit
      timedout { name }
      alert { title description kind proposedQueries { description query } }
      elapsedMilliseconds
      dynamicFilters { value count kind }
      results {
        __typename
        ... on FileMatch {
          repository { name }
          file { path commit { oid } }
          revSpec { ... on GitRevSpecExpr { expr } }
          chunkMatches { content contentStart { line }
            ranges { start { line character } end { line character } } }
          symbols { name kind containerName location { range { start { line } } } }
        }
        ... on CommitSearchResult {
          commit { oid subject author { date person { displayName } } repository { name } }
          matches { body { text } highlights { line character length } }
        }
        ... on Repository { name }
      }
    }
  }
  unindexed: search(query: $unindexed, version: V3, patternType: keyword) @include(if: $listed) {
    results {
      limitHit elapsedMilliseconds timedout { name } alert { title }
      results { ... on FileMatch { repository { name } file { path byteSize commit { oid } } } }
    }
  }
}
'''

# A submodule's URL with control characters is escaped.
args = ["show", "example.com/acme/widget@0123456789abcdef0123456789abcdef01234567:vendor"]
status.code = 0
stdout = '''
example.com/acme/widget@0123456789ab:vendor  submodule  https://example.com/a\u{1b}b\u{202e}c\u{200b}d e\u{d}f\u{0}g\u{2028}h\u{7f}i
'''

[[exchange]]
operation = "ShowFile"
variables = '{"ambiguous0":false,"end":500,"gitlab":false,"parent0":"","path0":"vendor","repo0":"example.com/acme/widget","repo1":"","rev0":"0123456789abcdef0123456789abcdef01234567","split":false,"start":1}'
query = '''
query ShowFile($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $start: Int!, $end: Int!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    meta: blob(path: $path0) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path0) { content(startLine: $start, endLine: $end, textOnly: true) }
    dir: tree(path: $path0) { entries { path } }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "body": null,
        "dir": null,
        "meta": null,
        "oid": "0123456789abcdef0123456789abcdef01234567",
        "parent": {
          "entries": [
            {
              "path": "vendor",
              "submodule": {
                "commit": "89abcdef0123456789abcdef0123456789abcdef",
                "url": "https://example.com/a\u001bb\u202ec\u200bd\ne\rf\u0000g\u2028h\u007fi"
              }
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  }
}
'''

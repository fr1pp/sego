# An open range of a raw read ends at a last line with no newline.
args = ["show", "--json", "example.com/acme/widget@main:big.c", "5-"]
status.code = 0
stdout = '''
{"repo":"example.com/acme/widget","rev":"main","commit":"d81fd54f1a2b3c4d5e6f708192a3b4c5d6e7f809","path":"big.c","total_lines":5,"byte_size":2000000,"binary":false,"crlf":false,"lfs_size":null,"submodule":null,"start":5,"end":5,"lines":[{"line":5,"text":"5"}],"via_raw":true}
'''

[[exchange]]
operation = "ShowFile"
variables = '{"ambiguous0":false,"end":500005,"gitlab":false,"parent0":"","path0":"big.c","repo0":"example.com/acme/widget","repo1":"","rev0":"main","split":false,"start":5}'
query = '''
query ShowFile($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $start: Int!, $end: Int!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    meta: blob(path: $path0) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path0) { content(startLine: $start, endLine: $end, textOnly: true) }
    dir: tree(path: $path0) { entries { path } }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "body": null,
        "dir": null,
        "meta": {
          "binary": false,
          "byteSize": 2000000,
          "lfs": null,
          "rawURL": "/r/example.com/acme/widget@d81fd54f1a2b3c4d5e6f708192a3b4c5d6e7f809/-/raw/big.c",
          "totalLines": 5
        },
        "oid": "d81fd54f1a2b3c4d5e6f708192a3b4c5d6e7f809",
        "parent": {
          "entries": [
            {
              "path": "big.c",
              "submodule": null
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  },
  "errors": [
    {
      "message": "not a directory: \"big.c\"",
      "path": [
        "r0",
        "c0",
        "dir"
      ]
    },
    {
      "message": "file exceeded size limit: BytesRead=1572865 (may be lower than file size)",
      "path": [
        "r0",
        "c0",
        "body",
        "content"
      ]
    },
    {
      "message": "file exceeded size limit: BytesRead=1572865 (may be lower than file size)",
      "path": [
        "r0",
        "c0",
        "meta",
        "lfs"
      ]
    }
  ]
}
'''

[[exchange]]
get = "/r/example.com/acme/widget@d81fd54f1a2b3c4d5e6f708192a3b4c5d6e7f809/-/raw/big.c"
status = 200
content-type = "text/plain; charset=utf-8"
body = "raw-read-open-range-in-json.body"

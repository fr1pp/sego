          "content": "#if defined(__MWERKS__)  //for use with CodeWarrior\r#   include <Carbon.h> //making a carbon project so need carbon.h\r#\tinclude <SIOUX.h> //this is used for window control in CodeWarrior\r#else //for use with project builder\r#\timport <CoreFoundation/CoreFoundation.h>  //This is the only ProjectBuilder include we really needed\r#\timport <CoreFoundation/CFPreferences.h>  //This is where all the CFPreference APIs come from.\r#\timport <stdio.h> //used when printing out to standard output\r#endif\r\r#ifdef __cplusplus\rextern \"C\" {\r#endif\r\r//These are used as constants for the second argument to  AddLoginItemWithPropertiesToUser.  Either the application is hidden on launch or shows up this property decides this.  \r#define kHideOnLaunch      true\r#define kDoNotHideOnLaunch false\r\r//These are used as constants for the third argument to  AddLoginItemWithPropertiesToUser.  You can either set the properties of the current user or all the users on the system (with kAllUsers).\r#define kCurrentUser kCFPreferencesCurrentUser\r#define kAllUsers    kCFPreferencesAnyUser\r\r//#define kAppStr \"loginwindow\"  \r#define kAppStr \"loginwindow\"  \r//The preference name where LoginItem information is stored.  We are actually writing to the file loginwindow.plist in either /Users/Library/Preferences/ directory (for the kCurrentUser) or the /Library/Preferences folder (for All Users).   Note that if you want to install this for all users on the system then you must be root/admin to do so.  If you need to know how to become root check out the sample code: \"AuthSample\" on the developer.apple.com website\r\r#define kKeyStr \"AutoLaunchedApplicationDictionary\" //The required \"special\" key for accessing LoginItem information.\r\r//defining types which are used as the request types into the function GetListOfLoginItems.  kFullPathInfo causes the routine to return the full path as a character string, kApplicationNameInfo causes just the application or alias name to be returned, kHideInfo returns if the application is hidden on launch or not.\r\r#define kFullPathInfo \t\t1\r#define kApplicationNameInfo \t2\r#define kHideInfo \t\t3\r\r//This is the character array size used by GetListOfLoginItems\r#define kLoginItemInfoLength 1025\r\r///*************************************************************************************************/\r// AddLoginItemWithPropertiesToUser\r//**************************************************************************************************/\r// This function will add a LoginItem to the list of LoginItems when called.  The properties\r// given to the new LoginItem are passed when calling the function.  Note that *no* check is made\r// when adding the LoginItem to ensure that the path points to a valid application.  Note that the LoginItem\r// Is always added to the *end* of the list of LoginItems.\r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToChange) -> A constant which represents which users preferences\r//                we want to change.  In this case there are two alternatives: kCurrentUser which\r//                changes the preferences of the current user.  The second alternative is kAllUsers.\r//                The kAllUsers LoginItems are launched for all users on the system.  You must be root\r//                or admin to use the kAllUsers option.\r// Second Parameter (AbsolutePath) -> \tThe absolute path of the application to be launched \r//                expressed as a Standard C string.  (example: \"/Applications/Clock\")\r// Third Parameter (HidetheApplicationOnStartup) -> A value representing if you want\r//                your application to be hidden at login time. kHideOnLaunch if you want the \r//                application to be hidden after it is launched.  If you want the application to show\r//                up normally use be hidden use kDoNotHideOnLaunch\r//\r// Output Parameters:\r// Return -> \tThis function returns a boolean value representing if the function was successful.\r//              The function returns true if the LoginItem was successfully added.  False if\r//              otherwise.  No additional error codes are returned. \r// Other Notes: This code doesn't work properly if more than one application is attempting to write to\r//              the LoginItems preference at once. \r//              Also no check is made to ensure that what you are adding to the LoginItem list isn't a \r//              duplicate.  If there is a duplicate however only one instance of the application is launched\r//**************************************************************************************************/\r\rBoolean AddLoginItemWithPropertiesToUser(CFStringRef WhosPreferencesToChange, const char* AbsolutePath, Boolean HidetheApplicationOnLaunch);\r\r//**************************************************************************************************/\r// ReturnLoginItemPropertyAtIndex\r//**************************************************************************************************/\r// This function will return the list of LoginItems as a CFArray.  \r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want to examine.  The two alternatives are: kCurrentUser which lists the LoginItems\r//                which are specific to that user (these are preferences found in /Users/<username>/Library/Preferences)\r//            \t  and kAnyUsers which lists LoginItems which are common to all users on the system (these\r//                preferences are found in /Library/Preferences/).\r// Second Parameter (RequestType) -> A constant representing which type of request for information you are making.  \r//                There are currently three request types.  kFullPathInfo which causes this routine to return the \r//                absolute path to the LoginItem which is stored as a C String (example return value:\r//                \"/Applications/Clock.app\").  Second alternative is kApplicationNameInfo which causes the routine to \r//                return the name of the application as a C string (example return value: \"Clock.app\").  Third \r//                alternative is kHideInfo which causes the routine to return the hide current status as a C string.  \r//                The two return types possible are the C Strings \"Hide\" and \"DoNotHide\" (example return value: \"Hide\")\r// Third Parameter (LoginItemIndex) -> An integer representing the LoginItem index.  Note that the LoginItems are \r//                stored as an array indexed from 0 to N-1 where N is the number of LoginItems.  Note that if an invalid\r//                index is passed then you will get a return value of NULL indicating error status.\r//\r// Output Parameters:\r// Return -> \tThis function returns a value of NULL if an error has occurred (likely caused by attempting to index an\r//              invalid LoginItemIndex).  If no error has occurred then a C String is returned which represents the data\r//              requested on the LoginItem at the index given.  The three return types are: \r//              1) For a kFullPathInfo request the absolute path of the LoginItem is returned (example: \r//              \"/Applications/TextEdit\").  2) For a kApplicationNameInfo request only the LoginItem name is returned\r//              with no path (example: \"TextEdit\").  3) For a kHideInfo request either the C string \"Hide\" is returned \r//              if LoginItem is hidden on launch or the C string value is \"DoNotHide\" if the LoginItem isn't hidden on \r//              launch\r// Other Notes: The actual indexing of the LoginItem array starts at zero and goes up to N-1 where N is the number of\r//              LoginItems.  Also, the order that the LoginItems are listed in the array is consistent with the ordering\r//              of the LoginItems within the preference file.  Note that the ordering of the LoginItems in the array\r//              *does not* correspond to the order which the LoginItems are launched.  The order which LoginItems are \r//              launched are determined by OSX at Login time and is based on what launch order would be most efficent.\r//**************************************************************************************************/\r\rchar* ReturnLoginItemPropertyAtIndex(CFStringRef WhosPreferencesToList, int RequestType, int LoginItemIndex);\r\r//**************************************************************************************************/\r// GetCountOfLoginItems\r//**************************************************************************************************/\r// This function will return the number of LoginItems for the user requested.    \r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want the number of LoginItems for.  The two alternatives are: kCurrentUser which lists the \r//                LoginItems which are specific to that user (these are preferences found in \r//                /Users/<username>/Library/Preferences) and kAnyUsers which lists LoginItems which are common to all \r//                users on the system (these preferences are found in /Library/Preferences/).\r//\r// Output Parameters:\r// Return -> \tThis function returns the number of LoginItems for the user requested as a signed integer. \r//**************************************************************************************************/\r\rint GetCountOfLoginItems(CFStringRef WhosPreferencesToList);\r\r//**************************************************************************************************/\r// RemoveLoginItemAtIndex\r//**************************************************************************************************/\r// This function will remove the LoginItem at the given index for the user specified.    \r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want to remove the LoginItem from.  The two alternatives are: kCurrentUser which removes login\r//                items for the which are specific to that user (these are preferences found in \r//                /Users/<username>/Library/Preferences) and kAnyUsers which lists LoginItems which are common to all \r//                users on the system (these preferences are found in /Library/Preferences/).\r// Second Parameter (LoginItemIndex) -> An integer representing the LoginItem index of the LoginItem you want removed. \r// \t\t It is assumed that you will look up the LoginItems using a couple ReturnLoginItemPropertyAtIndex calls\r//\t\t which will allow you to know which LoginItem you want to remove by index.  Note that the LoginItems are\r//               stored as an array indexed from 0 to N-1 where N is the number of LoginItems.  Note that if an invalid\r//               index is passed then you will get a return value of false indicating error status.\r//\r// Output Parameters:\r// Return -> \tThis function a boolean true if the LoginItem was successfully removed.  This function returns false if\r//\t\tthe LoginItem could not be removed (or if it was not found).  *Note that when you remove a LoginItem \r//\t\tfrom the list of LoginItems the index of all LoginItems following the removed item will be \r//\t\tdeincremented by one.  This means there will never be gaps in the list of LoginItems (i.e. empty slots \r//\t\tin the array of LoginItems). \r//**************************************************************************************************/\r\rBoolean RemoveLoginItemAtIndex(CFStringRef WhosPreferencesToChange, int LoginItemIndex);\r\r//**************************************************************************************************/\r// PrintOutLoginItemAtIndex\r//**************************************************************************************************/\r// This function will print out the LoginItem at the specified index \r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want to print the LoginItem from.  The two alternatives are: kCurrentUser which removes login\r//                items for the which are specific to that user (these are preferences found in \r//                /Users/<username>/Library/Preferences) and kAnyUsers which lists LoginItems which are common to all \r//                users on the system (these preferences are found in /Library/Preferences/).\r// Second Parameter (LoginItemIndex) -> An integer representing the LoginItem index of the LoginItem you want to \r// \t\tprint. Note that the LoginItems are stored as an array indexed from 0 to N-1 where N is the number of \r// \t\tLoginItems.  Note that if an invalid index is passed then you will get a return value of false \r//\t\tindicating error status.\r//\r// Output Parameters:\r// Return -> \tThis function a boolean true if the LoginItem was successfully printed.  \r//**************************************************************************************************/\r\rBoolean PrintOutLoginItemAtIndex(CFStringRef WhosPreferencesToList, int LoginItemIndex);\r\r//**************************************************************************************************/\r// PrintOutAllLoginItems\r//**************************************************************************************************/\r// This function will print out all the LoginItems for the specified user \r//**************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want to print the LoginItems from.  The two alternatives are: kCurrentUser which removes login\r//                items for the which are specific to that user (these are preferences found in \r//                /Users/<username>/Library/Preferences) and kAnyUsers which lists LoginItems which are common to all \r//                users on the system (these preferences are found in /Library/Preferences/).\r//\r// Output Parameters:\r// Return -> \tThis function a boolean true if the LoginItem was successfully printed.  \r//**************************************************************************************************/\r\rBoolean PrintOutAllLoginItems(CFStringRef WhosPreferencesToList);\r\r///*************************************************************************************************/\r// Input Parameters:\r// First Parameter (WhosPreferencesToList) -> \tA constant representing which users preferences \r//                you want to print the number of LoginItems from.  The two alternatives are: kCurrentUser \r// \t\twhich removes login items for the which are specific to that user (these are preferences found in \r//                /Users/<username>/Library/Preferences) and kAnyUsers which lists LoginItems which are common to all \r//                users on the system (these preferences are found in /Library/Preferences/).\r//\r// Output Parameters:\r// Return -> \tTrue if number of login items successfully printed. false otherwise.\r///*************************************************************************************************/\rBoolean PrintNumberOfLoginItems(CFStringRef WhosPreferencesToList);\r\r#ifdef __cplusplus\r}\r#endif\r"

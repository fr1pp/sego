# In JSON the lines hold the characters themselves, and a carriage return before a line feed marks the file as CRLF.
args = ["show", "--json", "example.com/acme/widget@0123456789abcdef0123456789abcdef01234567:f.txt"]
status.code = 0
stdout = '''
{"repo":"example.com/acme/widget","rev":"0123456789abcdef0123456789abcdef01234567","commit":"0123456789abcdef0123456789abcdef01234567","path":"f.txt","total_lines":9,"byte_size":50,"binary":false,"crlf":true,"lfs_size":null,"submodule":null,"start":1,"end":9,"lines":[{"line":1,"text":"a\u001bb"},{"line":2,"text":"c\u202ed"},{"line":3,"text":"e\u200bf"},{"line":4,"text":"g\u0000h"},{"line":5,"text":"i\u2028j"},{"line":6,"text":"k\u007fl"},{"line":7,"text":"mid\rcr"},{"line":8,"text":"tab\tok"},{"line":9,"text":"crlf"}],"via_raw":false}
'''

[[exchange]]
operation = "ShowFile"
variables = '{"ambiguous0":false,"end":500,"gitlab":false,"parent0":"","path0":"f.txt","repo0":"example.com/acme/widget","repo1":"","rev0":"0123456789abcdef0123456789abcdef01234567","split":false,"start":1}'
query = '''
query ShowFile($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $start: Int!, $end: Int!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    meta: blob(path: $path0) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path0) { content(startLine: $start, endLine: $end, textOnly: true) }
    dir: tree(path: $path0) { entries { path } }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "body": {
          "content": "a\u001bb\nc\u202ed\ne\u200bf\ng\u0000h\ni\u2028j\nk\u007fl\nmid\rcr\ntab\tok\ncrlf\r\n"
        },
        "dir": null,
        "meta": {
          "binary": false,
          "byteSize": 50,
          "lfs": null,
          "rawURL": "/r/example.com/acme/widget@0123456789abcdef0123456789abcdef01234567/-/raw/f.txt",
          "totalLines": 9
        },
        "oid": "0123456789abcdef0123456789abcdef01234567",
        "parent": {
          "entries": [
            {
              "path": "f.txt",
              "submodule": null
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  }
}
'''

    x1: path(path: $path1) @include(if: $split) { __typename }
  }
  g1: gitRefs(query: $rev1, first: 5) @include(if: $ambiguous1) { nodes { displayName } }
c2: commit(rev: $rev2) {
    oid
    meta: blob(path: $path2) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path2) { content(startLine: $start, endLine: $end, textOnly: true) }

    parent: tree(path: $parent2) { entries { path submodule { url commit } } }
    x2: path(path: $path2) @include(if: $split) { __typename }
  }
  g2: gitRefs(query: $rev2, first: 5) @include(if: $ambiguous2) { nodes { displayName } }
c3: commit(rev: $rev3) {
    oid
    meta: blob(path: $path3) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path3) { content(startLine: $start, endLine: $end, textOnly: true) }

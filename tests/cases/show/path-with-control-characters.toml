# A path with control characters, given as the argument, is escaped in the header.
args = ["show", "example.com/acme/widget@0123456789abcdef0123456789abcdef01234567:a\u001Bb\u202Ec\u200Bd\ne\rf\u0000g\u2028h\u007Fi"]
status.code = 0
stdout = '''
$'example.com/acme/widget@0123456789ab:a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i'  lines 1 of 1
1:x
'''

[[exchange]]
operation = "ShowFile"
variables = "{\"ambiguous0\":false,\"end\":500,\"gitlab\":false,\"parent0\":\"\",\"path0\":\"a\\u001bb\u202Ec\u200Bd\\ne\\rf\\u0000g\u2028h\u007Fi\",\"repo0\":\"example.com/acme/widget\",\"repo1\":\"\",\"rev0\":\"0123456789abcdef0123456789abcdef01234567\",\"split\":false,\"start\":1}"
query = '''
query ShowFile($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $start: Int!, $end: Int!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    meta: blob(path: $path0) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path0) { content(startLine: $start, endLine: $end, textOnly: true) }
    dir: tree(path: $path0) { entries { path } }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "body": {
          "content": "x\n"
        },
        "dir": null,
        "meta": {
          "binary": false,
          "byteSize": 2,
          "lfs": null,
          "rawURL": "/r/example.com/acme/widget@0123456789abcdef0123456789abcdef01234567/-/raw/f.txt",
          "totalLines": 1
        },
        "oid": "0123456789abcdef0123456789abcdef01234567",
        "parent": {
          "entries": [
            {
              "path": "a\u001bb\u202ec\u200bd\ne\rf\u0000g\u2028h\u007fi",
              "submodule": null
            }
          ]
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  }
}

# A tree URL of the repository root names the root as a directory.
args = ["show", "https://github.com/acme/widget/tree/main"]
status.code = 1
stderr = '''
sego: error: ./ is a directory at github.com/acme/widget@d81fd54f1a2b (2 entries)
'''

[[exchange]]
operation = "ShowFile"
variables = '{"ambiguous0":false,"end":500,"gitlab":false,"parent0":"","path0":"","repo0":"github.com/acme/widget","repo1":"","rev0":"main","split":true,"start":1}'
query = '''
query ShowFile($repo0: String!, $repo1: String!, $gitlab: Boolean!, $split: Boolean!, $start: Int!, $end: Int!
$rev0: String!, $path0: String!, $parent0: String!, $ambiguous0: Boolean!) {
  r0: repository(name: $repo0) { ...Guesses }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Guesses }
}

fragment Guesses on Repository {
  name
  defaultBranch { displayName }
c0: commit(rev: $rev0) {
    oid
    meta: blob(path: $path0) { byteSize totalLines binary rawURL lfs { byteSize } }
    body: blob(path: $path0) { content(startLine: $start, endLine: $end, textOnly: true) }
    dir: tree(path: $path0) { entries { path } }
    parent: tree(path: $parent0) { entries { path submodule { url commit } } }
    x0: path(path: $path0) @include(if: $split) { __typename }
  }
  g0: gitRefs(query: $rev0, first: 5) @include(if: $ambiguous0) { nodes { displayName } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "c0": {
        "body": null,
        "dir": {
          "entries": [
            {
              "path": "a"
            },
            {
              "path": "b"
            }
          ]
        },
        "meta": null,
        "oid": "d81fd54f1a2b3c4d5e6f708192a3b4c5d6e7f809",
        "parent": {
          "entries": [
            {
              "path": "docs",
              "submodule": null
            }
          ]
        },
        "x0": {
          "__typename": "GitTree"
        }
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "github.com/acme/widget"
    }
  },
  "errors": [
    {
      "message": "not a blob",
      "path": [
        "r0",
        "c0",
        "meta"
      ]
    },
    {
      "message": "not a blob",
      "path": [
        "r0",
        "c0",
        "body"
      ]
    }
  ]
}
'''

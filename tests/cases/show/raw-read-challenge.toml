# A Cloudflare challenge on the raw read is reported as the edge's refusal.
args = ["show", "example.com/acme/widget@main:big.c", "1-4"]
status.code = 3
stderr = '''
sego: error: sourcegraph.com's edge refused the request (HTTP 429, Cloudflare challenge)
'''

[[exchange]]
operation = "File"
variables = '{"content":true,"end":4,"gitlab":false,"path":"big.c","recursive":false,"repo0":"example.com/acme/widget","repo1":"","rev":"main","start":1}'
document = "File-f4700c66"
status = 200
content-type = "application/json"
evidence = "show/binary-file-over-content-limit"
response = '''

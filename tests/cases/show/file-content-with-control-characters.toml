# Control characters in a file's lines are escaped, and so is a CR, unless every line shown ends in CRLF.
args = ["show", "example.com/acme/widget@0123456789abcdef0123456789abcdef01234567:f.txt"]
status.code = 0
stdout = '''
example.com/acme/widget@0123456789ab:f.txt  lines 1-9 of 9
1:a\u{1b}b
2:c\u{202e}d
3:e\u{200b}f
4:g\u{0}h
5:i\u{2028}j
6:k\u{7f}l
7:mid\u{d}cr
8:tab	ok
9:crlf\u{d}
'''

[[exchange]]
operation = "File"
variables = '{"content":true,"end":500,"gitlab":false,"path":"f.txt","recursive":false,"repo0":"example.com/acme/widget","repo1":"","rev":"0123456789abcdef0123456789abcdef01234567","start":1}'
document = "File-f4700c66"
status = 200
content-type = "application/json"
response = '''
{

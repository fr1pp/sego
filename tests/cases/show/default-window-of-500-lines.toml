480:func uniqueVars(s1, s2 []string) error {
481:	for _, v1 := range s1 {
482:		for _, v2 := range s2 {
483:			if v1 == v2 {
484:				return fmt.Errorf("mux: duplicated route variable %q", v2)
485:			}
486:		}
487:	}
488:	return nil
489:}

# The lines of a raw read of a large file are escaped.
args = ["show", "example.com/acme/widget@0123456789abcdef0123456789abcdef01234567:big.txt", "1-7"]
status.code = 0
stdout = '''
example.com/acme/widget@0123456789ab:big.txt  lines 1-7 of 8
1:a\u{1b}b
2:c\u{202e}d
3:e\u{200b}f
4:g\u{0}h
5:i\u{2028}j
6:k\u{7f}l\u{d}
7:mid\u{d}cr
'''

[[exchange]]
operation = "File"
variables = '{"content":true,"end":7,"gitlab":false,"path":"big.txt","recursive":false,"repo0":"example.com/acme/widget","repo1":"","rev":"0123456789abcdef0123456789abcdef01234567","start":1}'
document = "File-f4700c66"
status = 200
content-type = "application/json"
evidence = "show/binary-file-over-content-limit"
response = '''
{
  "data": {
    "r0": {
      "commit": {
        "body": null,
        "meta": {
          "__typename": "GitBlob",
          "binary": false,
          "byteSize": 2000000,
          "lfs": null,
          "path": "big.txt",
          "rawURL": "/r/example.com/acme/widget@0123456789abcdef0123456789abcdef01234567/-/raw/big.txt",
          "submodule": null,
          "totalLines": 8
        },
        "oid": "0123456789abcdef0123456789abcdef01234567"
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget"
    }
  },
  "errors": [
    {
      "message": "file exceeded size limit: BytesRead=1572865 (may be lower than file size)",
      "path": [
        "r0",
        "commit",
        "body",
        "content"
      ]
    },
    {
      "message": "file exceeded size limit: BytesRead=1572865 (may be lower than file size)",
      "path": [
        "r0",
        "commit",
        "meta",
        "lfs"
      ]
    }
  ]
}
'''

[[exchange]]
get = "/r/example.com/acme/widget@0123456789abcdef0123456789abcdef01234567/-/raw/big.txt"
status = 200
content-type = "text/plain; charset=utf-8"
body = "raw-read-with-control-characters.body"

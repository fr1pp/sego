# SEGO_ENDPOINT names the server sego connects to.
args = ["search", "foo"]
env = { SEGO_ENDPOINT = "http://127.0.0.1:9/" }
status.code = 0
stdout = '''
0 matches  0.0 s
query  foo
'''
stderr = '''
sego: note: the search can't tell which files it skipped; files over 1 MiB and files with too many distinct trigrams are never searched
sego: note: Sourcegraph doesn't report a search backend that fails to answer, and a 0 can come from one
'''

[[exchange]]
operation = "Search"
variables = '{"listed":false,"query":"foo","unindexed":""}'
document = "Search-328cc8ec"
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "search": {
      "results": {
        "alert": null,
        "approximateResultCount": "0",
        "dynamicFilters": [],
        "elapsedMilliseconds": 15,
        "limitHit": false,
        "matchCount": 0,
        "results": [],
        "timedout": []
      }
    }
  }
}
'''

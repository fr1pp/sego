# A range whose base is missing is not read as a root commit.
args = ["diff", "example.com/acme/widget@v0...v1"]
status.code = 1
stderr = '''
sego: error: base revision v0 not found in example.com/acme/widget
'''

[[exchange]]
operation = "Range"
variables = '{"a":"v0","b":"v1","gitlab":false,"repo0":"example.com/acme/widget","repo1":""}'
document = "Range-782f210b"
status = 200
content-type = "application/json"
response = '''
{
  "data": {

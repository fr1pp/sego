# File paths with control characters are escaped in the rows.
args = ["diff", "example.com/acme/widget@v1.0.0...v2.0.0"]
status.code = 0
stdout = '''
example.com/acme/widget@0123456789ab...89abcdef0123  4 files  +7 -7  base fedcba987654  rev v1.0.0...v2.0.0
M  +1 -1  $'a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i'
R  +2 -2  $'o-a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i' -> $'n-a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i'
A  +4 -0  $'a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i-added'
D  +0 -4  $'a\033b\342\200\256c\342\200\213d\ne\015f\000g\342\200\250h\177i-deleted'
'''

[[exchange]]
operation = "Diff"
variables = '{"a":"v1.0.0","b":"v2.0.0","first":201,"gitlab":false,"patch":false,"paths":null,"repo0":"example.com/acme/widget","repo1":""}'
query = '''
query Diff($repo0: String!, $repo1: String!, $gitlab: Boolean!, $a: String!, $b: String!, $paths: [String!], $first: Int, $patch: Boolean!) {
  a0: repository(name: $repo0) { ...Base }
  b0: repository(name: $repo0) { ...Head }
  c0: repository(name: $repo0) { ...Comparison }
  a1: repository(name: $repo1) @include(if: $gitlab) { ...Base }
  b1: repository(name: $repo1) @include(if: $gitlab) { ...Head }
  c1: repository(name: $repo1) @include(if: $gitlab) { ...Comparison }
}

fragment Base on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $a) {
    oid

  }
}

fragment Head on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $b) {
    oid parents { oid }

  }
}

fragment Comparison on Repository {
  name
  defaultBranch { displayName }
  comparison(base: $a, head: $b) {
    all: fileDiffs(first: 0, paths: $paths) { totalCount diffStat { added deleted } }
    page: fileDiffs(first: $first, paths: $paths) {
      nodes { oldPath newPath stat { added deleted } oldFile { ... on GitBlob { commit { oid } } } }
    }
    patch: fileDiffs(paths: $paths) @include(if: $patch) { rawDiff }
  }
}
'''
status = 200
content-type = "application/json"

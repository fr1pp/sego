# A patch is printed as served, indented, whatever its lines look like.
args = ["diff", "example.com/acme/widget@v1...v2", "dir/a b.go"]
status.code = 0
stdout = '''
'example.com/acme/widget@0123456789ab...89abcdef0123:dir/a b.go'  1 file  +2 -1  base 0123456789ab  rev v1...v2
M  +2 -1  'dir/a b.go'

    diff --git dir/a b.go dir/a b.go
    index 1111111..2222222 100644
    --- dir/a b.go
    +++ dir/a b.go
    @@ -1,2 +1,2 @@
    --- foo
    +-- bar
     ctx
    +red\u{1b}[31m
    \ No newline at end of file
'''

[[exchange]]
operation = "Diff"
variables = '{"a":"v1","b":"v2","first":201,"gitlab":false,"patch":true,"path0":"dir/a b.go","paths":["dir/a b.go"],"repo0":"example.com/acme/widget","repo1":""}'
query = '''
query Diff($repo0: String!, $repo1: String!, $gitlab: Boolean!, $a: String!, $b: String!, $paths: [String!], $first: Int, $patch: Boolean!, $path0: String!) {
  a0: repository(name: $repo0) { ...Base }
  b0: repository(name: $repo0) { ...Head }
  c0: repository(name: $repo0) { ...Comparison }
  a1: repository(name: $repo1) @include(if: $gitlab) { ...Base }
  b1: repository(name: $repo1) @include(if: $gitlab) { ...Head }
  c1: repository(name: $repo1) @include(if: $gitlab) { ...Comparison }
}

fragment Base on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $a) {
    oid
    p0: path(path: $path0) { __typename }
  }
}

fragment Head on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $b) {
    oid parents { oid }
    p0: path(path: $path0) { __typename }
  }
}

fragment Comparison on Repository {
  name
  defaultBranch { displayName }
  comparison(base: $a, head: $b) {
    all: fileDiffs(first: 0, paths: $paths) { totalCount diffStat { added deleted } }
    page: fileDiffs(first: $first, paths: $paths) {
      nodes { oldPath newPath stat { added deleted } oldFile { ... on GitBlob { commit { oid } } } }
    }
    patch: fileDiffs(paths: $paths) @include(if: $patch) { rawDiff }
  }
}
'''
status = 200
content-type = "application/json"

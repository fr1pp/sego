# In JSON the patch and the path hold the characters themselves.
args = ["diff", "--json", "example.com/acme/widget@v1.0.0...v2.0.0", "a\u001Bb\u202Ec\u200Bd\ne\rf\u0000g\u2028h\u007Fi"]
status.code = 0

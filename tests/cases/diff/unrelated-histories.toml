# With no shared history the base is A itself.
args = ["diff", "example.com/acme/widget@gh-pages...main"]
status.code = 0
stdout = '''
example.com/acme/widget@e7df16ff0ce8...cc9969c2e219  4 files  +65 -0  base e7df16ff0ce8  rev gh-pages...main
R  +0 -0  .nojekyll -> .agents/rules/.gitkeep
A  +64 -0  .agents/rules/unit_tests.md
A  +0 -0  .agents/skills/.gitkeep
A  +1 -0  .claude/rules
'''

[[exchange]]
operation = "Diff"
variables = '{"a":"gh-pages","b":"main","first":201,"gitlab":false,"patch":false,"paths":null,"repo0":"example.com/acme/widget","repo1":""}'
query = '''
query Diff($repo0: String!, $repo1: String!, $gitlab: Boolean!, $a: String!, $b: String!, $paths: [String!], $first: Int, $patch: Boolean!) {
  a0: repository(name: $repo0) { ...Base }
  b0: repository(name: $repo0) { ...Head }
  c0: repository(name: $repo0) { ...Comparison }
  a1: repository(name: $repo1) @include(if: $gitlab) { ...Base }
  b1: repository(name: $repo1) @include(if: $gitlab) { ...Head }
  c1: repository(name: $repo1) @include(if: $gitlab) { ...Comparison }
}

fragment Base on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $a) {
    oid

  }
}

fragment Head on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $b) {
    oid parents { oid }

  }
}

fragment Comparison on Repository {
  name
  defaultBranch { displayName }
  comparison(base: $a, head: $b) {
    all: fileDiffs(first: 0, paths: $paths) { totalCount diffStat { added deleted } }
    page: fileDiffs(first: $first, paths: $paths) {
      nodes { oldPath newPath stat { added deleted } oldFile { ... on GitBlob { commit { oid } } } }
    }
    patch: fileDiffs(paths: $paths) @include(if: $patch) { rawDiff }
  }
}
'''
status = 200
content-type = "application/json"

      },
      "name": "example.com/acme/widget"
    },
    "b0": {
      "commit": {
        "oid": "76543210fedcba98765432100123456789abcdef",
        "parents": [
          {
            "oid": "0a1b2c3d4e5f60718293a4b5c6d7e8f901234567"
          }
        ]
      },

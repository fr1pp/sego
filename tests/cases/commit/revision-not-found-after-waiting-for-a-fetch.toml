# A revision the server says is not found after waiting for a fetch, which the request's other part started, is named as missing.
args = ["show", "example.com/acme/widget@v1"]
status.code = 1
stderr = '''
sego: error: revision v1 not found in example.com/acme/widget
'''

[[exchange]]
operation = "Commit"
variables = '{"first":200,"gitlab":false,"patch":false,"paths":null,"repo0":"example.com/acme/widget","repo1":"","rev":"v1"}'
document = "Commit-50a06158"
status = 200
content-type = "application/json"
evidence = "diff/missing-both-revisions"
response = '''
{
  "data": {
    "r0": {
      "commit": null,
      "defaultBranch": {
        "displayName": "main"
      },
      "mirrorInfo": null,
      "name": "example.com/acme/widget"
    }
  },
  "errors": [
    {
      "message": "revision not found after waiting for a fetch already in progress: repo 1",
      "path": [
        "r0",
        "commit"
      ]
    }
  ]
}
'''

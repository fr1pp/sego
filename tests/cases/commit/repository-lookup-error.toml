# A failed repository lookup fails the commit, and the server's text is not printed.
args = ["show", "example.com/acme/widget@v1"]
status.code = 3
stderr = '''
sego: error: Sourcegraph failed to answer the repository lookup
'''

[[exchange]]
operation = "Commit"
variables = '{"first":200,"gitlab":false,"patch":false,"paths":null,"repo0":"example.com/acme/widget","repo1":"","rev":"v1"}'
document = "Commit-50a06158"
status = 200
content-type = "application/json"
evidence = "none: a server failure sourcegraph.com doesn't give on demand"
response = '''
{
  "data": {
    "r0": {
      "commit": null,
      "defaultBranch": null,
      "mirrorInfo": null,
      "name": "example.com/acme/widget"
    }
  },
  "errors": [
    {
      "message": "secret",
      "path": [
        "r0",
        "defaultBranch"
      ]
    }
  ]
}
'''

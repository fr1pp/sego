# A merge commit is diffed against its first parent.
args = ["show", "github.com/gorilla/mux@abccd7e4d7c117370b7908f51e48decb38b6835b"]
status.code = 0
stdout = '''
github.com/gorilla/mux@abccd7e4d7c1  2023-07-15  Corey Daley  parents eb99d7a67714 7456b4e9ae7b  1 file  +0 -6  diff against first parent
    Merge pull request #713 from gorilla/coreydaley-patch-1

    Update README.md

M  +0 -6  README.md
'''

[[exchange]]
operation = "ShowCommit"
variables = '{"base":"abccd7e4d7c117370b7908f51e48decb38b6835b^1","gitlab":false,"repo0":"github.com/gorilla/mux","repo1":"","rev":"abccd7e4d7c117370b7908f51e48decb38b6835b"}'
query = '''
query ShowCommit($repo0: String!, $repo1: String!, $gitlab: Boolean!, $rev: String!, $base: String!) {
  m0: repository(name: $repo0) { ...Commit }
  d0: repository(name: $repo0) { ...Changes }
  m1: repository(name: $repo1) @include(if: $gitlab) { ...Commit }
  d1: repository(name: $repo1) @include(if: $gitlab) { ...Changes }
}

fragment Commit on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $rev) {
    oid subject message
    author { date person { displayName } }
    committer { date person { displayName } }
    parents { oid }
  }
}

fragment Changes on Repository {
  name
  defaultBranch { displayName }
  comparison(base: $base, head: $rev) {
    all: fileDiffs(first: 0) { totalCount diffStat { added deleted } }
    page: fileDiffs(first: 200) { nodes { oldPath newPath stat { added deleted } } }
  }
}
'''
status = 200
content-type = "application/json"

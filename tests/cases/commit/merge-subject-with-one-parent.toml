# A commit with a merge subject and one parent is not a merge.
args = ["show", "example.com/acme/widget@v1"]
status.code = 0
stdout = '''
example.com/acme/widget@affe2b9b7c60  2026-09-09  Jonathan Davies  parents 6b668aa526af  1 file  +1 -1  rev v1
    Merge branch 'x'

M  +1 -1  a.go
'''

[[exchange]]
operation = "ShowCommit"
variables = '{"base":"v1^1","gitlab":false,"repo0":"example.com/acme/widget","repo1":"","rev":"v1"}'
query = '''
query ShowCommit($repo0: String!, $repo1: String!, $gitlab: Boolean!, $rev: String!, $base: String!) {
  m0: repository(name: $repo0) { ...Commit }
  d0: repository(name: $repo0) { ...Changes }
  m1: repository(name: $repo1) @include(if: $gitlab) { ...Commit }
  d1: repository(name: $repo1) @include(if: $gitlab) { ...Changes }
}

fragment Commit on Repository {
  name
  defaultBranch { displayName }
  commit(rev: $rev) {
    oid subject message
    author { date person { displayName } }
    committer { date person { displayName } }
    parents { oid }
  }
}

fragment Changes on Repository {
  name
  defaultBranch { displayName }
  comparison(base: $base, head: $rev) {
    all: fileDiffs(first: 0) { totalCount diffStat { added deleted } }
    page: fileDiffs(first: 200) { nodes { oldPath newPath stat { added deleted } } }
  }
}
'''

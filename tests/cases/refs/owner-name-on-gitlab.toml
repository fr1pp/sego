# owner/name resolves to the one host that has it.
args = ["refs", "acme/widget"]
status.code = 0
stdout = '''
gitlab.com/acme/widget  1 branch  0 tags
branch  000000000000  2026-01-02  main  (default)
'''

[[exchange]]
operation = "Refs"
variables = '{"first":101,"gitlab":true,"query":null,"repo0":"github.com/acme/widget","repo1":"gitlab.com/acme/widget","unfiltered":false}'
query = '''
query Refs($repo0: String!, $repo1: String!, $gitlab: Boolean!, $first: Int, $query: String, $unfiltered: Boolean!) {
  r0: repository(name: $repo0) { ...Refs }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Refs }
}

fragment Refs on Repository {
  name
  defaultBranch { displayName }
  branches(first: $first, query: $query) { ...Listing }
  tags(first: $first, query: $query) { ...Listing }
  all_branches: branches(first: 1) @include(if: $unfiltered) { totalCount }
  all_tags: tags(first: 1) @include(if: $unfiltered) { totalCount }
}

fragment Listing on GitRefConnection {
  totalCount
  nodes { displayName target { oid commit { committer { date } } } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": null,
    "r1": {
      "branches": {
        "nodes": [
          {
            "displayName": "main",
            "target": {
              "commit": {
                "committer": {
                  "date": "2026-01-02T03:04:05Z"
                }
              },
              "oid": "0000000000000000000000000000000000000003"
            }
          }
        ],
        "totalCount": 1
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "gitlab.com/acme/widget",
      "tags": {
        "nodes": [],
        "totalCount": 0
      }
    }
  }
}
'''

# Totals past the refs the server listed set branches_more and tags_more.
args = ["refs", "--json", "example.com/acme/widget"]
status.code = 0
stdout = '''
{"repo":"example.com/acme/widget","query":null,"default_branch":"b0","branches_total":17001,"tags_total":17002,"branches_all":null,"tags_all":null,"branches_more":true,"tags_more":true,"refs":[{"kind":"branch","name":"b0","commit":"0000000000000000000000000000000000000001","date":"2026-01-01"},{"kind":"branch","name":"b1","commit":"0000000000000000000000000000000000000002","date":"2026-01-02"},{"kind":"branch","name":"b2","commit":"0000000000000000000000000000000000000003","date":"2026-01-03"},{"kind":"tag","name":"t0","commit":"0000000000000000000000000000000000000001","date":"2026-01-01"},{"kind":"tag","name":"t1","commit":"0000000000000000000000000000000000000002","date":"2026-01-02"}]}
'''

[[exchange]]
operation = "Refs"
variables = '{"first":null,"gitlab":false,"query":null,"repo0":"example.com/acme/widget","repo1":"","unfiltered":false}'
query = '''
query Refs($repo0: String!, $repo1: String!, $gitlab: Boolean!, $first: Int, $query: String, $unfiltered: Boolean!) {
  r0: repository(name: $repo0) { ...Refs }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Refs }
}

fragment Refs on Repository {
  name
  defaultBranch { displayName }
  branches(first: $first, query: $query) { ...Listing }
  tags(first: $first, query: $query) { ...Listing }
  all_branches: branches(first: 1) @include(if: $unfiltered) { totalCount }
  all_tags: tags(first: 1) @include(if: $unfiltered) { totalCount }
}

fragment Listing on GitRefConnection {
  totalCount
  nodes { displayName target { oid commit { committer { date } } } }
}
'''

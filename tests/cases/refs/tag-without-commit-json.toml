# In JSON a tag whose commit Sourcegraph can't dereference has a null commit and date.
args = ["refs", "--json", "example.com/acme/widget"]
status.code = 0
stdout = '''
{"repo":"example.com/acme/widget","query":null,"default_branch":"main","branches_total":1,"tags_total":2,"branches_all":null,"tags_all":null,"branches_more":false,"tags_more":false,"refs":[{"kind":"branch","name":"main","commit":"0000000000000000000000000000000000000001","date":"2026-03-01"},{"kind":"tag","name":"v2","commit":"0000000000000000000000000000000000000002","date":"2026-02-01"},{"kind":"tag","name":"v1-tree","commit":null,"date":null}]}
'''

[[exchange]]
operation = "Refs"
variables = '{"first":null,"gitlab":false,"query":null,"repo0":"example.com/acme/widget","repo1":"","unfiltered":false}'
query = '''
query Refs($repo0: String!, $repo1: String!, $gitlab: Boolean!, $first: Int, $query: String, $unfiltered: Boolean!) {
  r0: repository(name: $repo0) { ...Refs }
  r1: repository(name: $repo1) @include(if: $gitlab) { ...Refs }
}

fragment Refs on Repository {
  name
  defaultBranch { displayName }
  branches(first: $first, query: $query) { ...Listing }
  tags(first: $first, query: $query) { ...Listing }
  all_branches: branches(first: 1) @include(if: $unfiltered) { totalCount }
  all_tags: tags(first: 1) @include(if: $unfiltered) { totalCount }
}

fragment Listing on GitRefConnection {
  totalCount
  nodes { displayName target { oid commit { committer { date } } } }
}
'''
status = 200
content-type = "application/json"
response = '''
{
  "data": {
    "r0": {
      "branches": {
        "nodes": [
          {
            "displayName": "main",
            "target": {
              "commit": {
                "committer": {
                  "date": "2026-03-01T12:00:00Z"
                }
              },
              "oid": "0000000000000000000000000000000000000001"
            }
          }
        ],
        "totalCount": 1
      },
      "defaultBranch": {
        "displayName": "main"
      },
      "name": "example.com/acme/widget",
      "tags": {
        "nodes": [
          {
            "displayName": "v2",
            "target": {
              "commit": {
                "committer": {
                  "date": "2026-02-01T08:30:00Z"
                }
              },
              "oid": "0000000000000000000000000000000000000002"
            }
          },
          {
            "displayName": "v1-tree",
            "target": {
              "commit": null,
              "oid": "0000000000000000000000000000000000000003"
            }
          }
        ],
        "totalCount": 2
      }
    }
  }
}
'''

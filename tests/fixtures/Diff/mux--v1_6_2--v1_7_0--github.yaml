      defaultBranch:
        displayName: main
      name: github.com/gorilla/mux
    b0:
      commit:
        oid: a7962380ca08b5a188038c69871b8d3fbdf31e89
        p0:
          __typename: GitTree
        parents:
        - oid: 797e653da60e4619dcb0ae703714147b5a7454c6
      defaultBranch:
        displayName: main
      name: github.com/gorilla/mux
    c0:
      comparison:
        all:
          diffStat:
            added: 20
            deleted: 0
          totalCount: 2
        page:
          nodes:
          - newPath: .github/release-drafter.yml
            oldFile: null
            oldPath: null
            stat:
              added: 8
              deleted: 0
          - newPath: .github/stale.yml
            oldFile: null
            oldPath: null
            stat:
              added: 12
              deleted: 0
        patch:
          rawDiff: |
            diff --git .github/release-drafter.yml .github/release-drafter.yml
            new file mode 100644
            index 0000000000000000000000000000000000000000..2db2e1397ec7b63ebe94d7536548cba72f20e7bd
            --- /dev/null

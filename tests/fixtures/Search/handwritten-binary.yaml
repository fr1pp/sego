operation: Search
variables:
  query: repo:sego-fake/binary foo
  unindexed: "repo:sego-fake/binary type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"
status: 200
headers:
  content-type: application/json
handwritten: true
response:
  data:
    search:
      results:
        matchCount: 1
        approximateResultCount: "1"
        limitHit: false
        timedout: []
        alert: null
        elapsedMilliseconds: 100
        dynamicFilters: []
        results: 
          - __typename: FileMatch
            repository:
              name: github.com/sego-fake/binary
            file:
              path: blob.bin
              commit:
                oid: 0123456789abcdef0123456789abcdef01234567
            revSpec: null
            chunkMatches:
              - content: "ab\u0000cd\nfoo"
                contentStart:
                  line: 0
                ranges:
                  - start:
                      line: 1
                      character: 0
                    end:
                      line: 1
                      character: 3
            symbols: []
    unindexed:
      results:
        limitHit: false
        elapsedMilliseconds: 10
        timedout: []
        alert: null
        results: []

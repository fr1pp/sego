operation: Search
variables:
  query: selftest-kinds
status: 200
headers:
  content-type: application/json
handwritten: true
response:
  data:
    search:
      results:
        matchCount: 4
        approximateResultCount: "4"
        limitHit: false
        timedout: []
        alert: null
        elapsedMilliseconds: 12
        dynamicFilters:
          - value: "lang:go"
            count: 3
            kind: lang
        results:
          - __typename: FileMatch
            repository:
              name: github.com/a/b
            file:
              path: src/main.go
              commit:
                oid: 0123456789abcdef0123456789abcdef01234567
            revSpec:
              expr: v1.0
            chunkMatches:
              - content: "func main() {\n}"
                contentStart:
                  line: 9
                ranges:
                  - start:
                      line: 9
                      character: 5
                    end:
                      line: 9
                      character: 9
            symbols:
              - name: main
                kind: FUNCTION
                containerName: null
                location:
                  range:
                    start:
                      line: 9
          - __typename: CommitSearchResult
            commit:
              oid: fedcba9876543210fedcba9876543210fedcba98
              subject: Fix the thing
              author:
                date: "2024-01-02T03:04:05Z"
                person:
                  displayName: null
              repository:
                name: github.com/a/b
            matches:
              - body:
                  text: "Fix the thing"
                highlights:
                  - line: 0
                    character: 4
                    length: 3
          - __typename: Repository
            name: github.com/c/d
          - __typename: NewKind

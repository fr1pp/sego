operation: Search
variables:
  query: repo:sego-fake/widen-nonzero foo
  unindexed: "repo:sego-fake/widen-nonzero type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"
status: 200
headers:
  content-type: application/json
handwritten: true
response:
  data:
    search:
      results:
        matchCount: 1
        approximateResultCount: "1"
        limitHit: false
        timedout: []
        alert: null
        elapsedMilliseconds: 100
        dynamicFilters: 
          - value: archived:yes
            count: 10
            kind: utility
          - value: fork:yes
            count: 1
            kind: utility
          - value: lang:go
            count: 1
            kind: lang
        results: 
          - __typename: FileMatch
            repository:
              name: github.com/sego-fake/widen-nonzero
            file:
              path: main.go
              commit:
                oid: 0123456789abcdef0123456789abcdef01234567
            revSpec: null
            chunkMatches:
              - content: "foo"
                contentStart:
                  line: 0
                ranges:
                  - start:
                      line: 0
                      character: 0
                    end:
                      line: 0
                      character: 3
            symbols: []
    unindexed:
      results:
        limitHit: false
        elapsedMilliseconds: 10
        timedout: []
        alert: null
        results: []

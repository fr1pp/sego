operation: Search
variables:
  query: repo:^github\.com/gorilla/mux$@v1.8.0 select:file.directory NewRouter count:100
query: |
  query Search($query: String!) {
    search(query: $query, version: V3, patternType: keyword) {
      results {
        matchCount approximateResultCount limitHit repositoriesCount
        timedout { name } cloning { name } missing { name }
        alert { title description kind proposedQueries { description query } }
        elapsedMilliseconds
        dynamicFilters { value label count limitHit kind }
        results {
          __typename
          ... on FileMatch {
            repository { name }
            file { path commit { oid } }
            revSpec { ... on GitRevSpecExpr { expr } }
            chunkMatches { content contentStart { line }
              ranges { start { line character } end { line character } } }
            symbols { name kind containerName location { range { start { line } } } }
          }
          ... on CommitSearchResult {
            commit { oid subject author { date person { displayName } } repository { name } }
            matches { body { text } highlights { line character length } }
          }
          ... on Repository { name }
        }
      }
    }
  }
status: 200
headers:
  content-type: application/json
response:
  data:
    search:
      results:
        alert: null
        approximateResultCount: 1+
        cloning: []
        dynamicFilters:
        - count: 1
          kind: type
          label: Paths
          limitHit: true
          value: type:path
        - count: 1
          kind: lang
          label: Go
          limitHit: true
          value: lang:go
        - count: 1
          kind: repo
          label: github.com/gorilla/mux
          limitHit: true
          value: repo:^github\.com/gorilla/mux$@v1.8.0
        elapsedMilliseconds: 535
        limitHit: true
        matchCount: 1
        missing: []
        repositoriesCount: 1
        results:
        - __typename: FileMatch
          chunkMatches: []
          file:
            commit:
              oid: 98cb6bf42e086f6af920b965c38cacc07402d51b
            path: ./
          repository:
            name: github.com/gorilla/mux
          revSpec:
            expr: v1.8.0
          symbols: []
        timedout: []

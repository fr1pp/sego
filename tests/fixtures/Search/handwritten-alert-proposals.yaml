operation: Search
variables:
  query: repo:sego-fake/alert foo
  unindexed: "repo:sego-fake/alert type:file select:file index:only patterntype:regexp ^NOT-INDEXED:\\ (exceeds\\ the\\ maximum\\ size\\ limit|contains\\ too\\ many\\ trigrams)$ count:all timeout:20s"
status: 200
headers:
  content-type: application/json
handwritten: true
response:
  data:
    search:
      results:
        matchCount: 1
        approximateResultCount: "1"
        limitHit: false
        timedout: []
        alert: 
          title: Too many results
          description: Narrow the search.
          kind: null
          proposedQueries:
            - description: only go
              query: repo:sego-fake/alert foo lang:go
            - description: only rust
              query: repo:sego-fake/alert foo lang:rust
        elapsedMilliseconds: 800
        dynamicFilters: []
        results: 
          - __typename: Repository
            name: github.com/sego-fake/found
    unindexed:
      results:
        limitHit: false
        elapsedMilliseconds: 10
        timedout: []
        alert: null
        results: []

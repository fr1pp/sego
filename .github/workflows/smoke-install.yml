name: Install the release

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-24.04
            container: alpine:3
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - if: matrix.container
        run: apk add --no-cache curl
      - run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/fr1pp/sego/releases/download/$TAG/sego-installer.sh" | SEGO_UNMANAGED_INSTALL="$HOME/bin" sh
          test "$("$HOME/bin/sego" --version)" = "sego ${TAG#v}"
          "$HOME/bin/sego" show github.com/gorilla/mux@v1.8.0:go.mod

[package]
name = "sego"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Code search for agents, through Sourcegraph"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false

[[bin]]
name = "sego"
test = false

[dependencies]
etcetera = "0.11"
lexopt = "0.3.2"
ring = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", default-features = false }
unicode-width = "0.2.3"
ureq = "3.5.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
similar = "3"
toml_edit = "0.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"

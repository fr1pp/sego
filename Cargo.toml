[package]
name = "sego"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Code search for agents, built on Sourcegraph."
license = "MIT OR Apache-2.0"
repository = "https://github.com/fr1pp/sego"
keywords = ["code-search", "sourcegraph", "agents", "cli", "grep"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
doctest = false

[[bin]]
name = "sego"
test = false

[dependencies]
etcetera = "0.11"
lexopt = "0.3.2"
ring = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", default-features = false }
unicode-width = "0.2.3"
ureq = "3.5.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
insta = { version = "1.49", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
todo = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

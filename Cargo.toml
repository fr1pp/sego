[package]
name = "sego"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Find and inspect public source code at any revision, for coding agents"
publish = false
autotests = false

[[bin]]
name = "sego"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/lib.rs"

[dependencies]
lexopt = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
ureq = "3.4.2"

[dev-dependencies]
expect-test = "1.5.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

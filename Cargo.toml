[package]
name = "sego"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Read public source code at any revision, for coding agents"
publish = false

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "sego"
path = "src/main.rs"
test = false

[dependencies]
etcetera = "0.11"
lexopt = "0.3.2"
ring = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", default-features = false }
unicode-width = "0.2.2"
ureq = "3.4.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
serde-saphyr = "1.3.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
